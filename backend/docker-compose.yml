services:
  # ── Database Migration Runner ─────────────────────────────────────────────
  # Runs the versioned Migrator FIRST so the backend never races with DDL.
  # NOTE: migrations/sql/ must NOT be mounted into postgres:/docker-entrypoint-initdb.d
  # (both would run the same DDL and fail with "relation already exists").
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["migrate"]
    environment:
      DATABASE_URL: postgresql://aeroxe:${POSTGRES_PASSWORD:-secret}@postgres:5432/aeroxe
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aeroxe-net
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Frontend (static SPA served by nginx) ─────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${APP_PUBLIC_URL:-http://localhost:8000}/api
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "${FRONTEND_HTTPS_PORT:-}:443"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - aeroxe-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ── Backend API ───────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://aeroxe:${POSTGRES_PASSWORD:-secret}@postgres:5432/aeroxe
      REDIS_URL: redis://:${REDIS_PASSWORD:-aeroxe_redis_secret}@redis:6379
      NATS_URL: nats://nats:4222
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_REGION: us-east-1
      TRUST_PROXY: ${TRUST_PROXY:-false}
      MINIO_BUCKET_KYC: aeroxe-kyc
      MINIO_BUCKET_INVOICES: aeroxe-invoices
      MINIO_BUCKET_DOCUMENTS: aeroxe-documents
      SERVER_ADDR: "0.0.0.0:8000"
      APP_ENV: ${APP_ENV:-development}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8000}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      RATE_LIMIT_AUTH: ${RATE_LIMIT_AUTH:-15}
      RATE_LIMIT_API_READ: ${RATE_LIMIT_API_READ:-100}
      RATE_LIMIT_API_WRITE: ${RATE_LIMIT_API_WRITE:-30}
      RATE_LIMIT_UPLOAD: ${RATE_LIMIT_UPLOAD:-10}
      RATE_LIMIT_ADMIN_READ: ${RATE_LIMIT_ADMIN_READ:-200}
      RATE_LIMIT_ADMIN_WRITE: ${RATE_LIMIT_ADMIN_WRITE:-100}
      RATE_LIMIT_CUSTOMER_READ: ${RATE_LIMIT_CUSTOMER_READ:-50}
      RATE_LIMIT_CUSTOMER_WRITE: ${RATE_LIMIT_CUSTOMER_WRITE:-20}
      # Integration secrets (optional — warn at boot if missing)
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
      RADIUS_SECRET: ${RADIUS_SECRET:-}
      MIKROTIK_PASSWORD: ${MIKROTIK_PASSWORD:-}
      HUAWEI_OLT_PASSWORD: ${HUAWEI_OLT_PASSWORD:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      RUST_LOG: ${RUST_LOG:-aeroxe_backend=info,tower_http=info}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      minio:
        condition: service_started
    restart: unless-stopped
    networks:
      - aeroxe-net
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

  # ── Database ──────────────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: aeroxe
      POSTGRES_USER: aeroxe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      # Performance tuning for production
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=100
      - -c
      - log_min_duration_statement=1000
      - -c
      - log_checkpoints=on
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeroxe -d aeroxe"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aeroxe-net
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

  # ── Cache ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-aeroxe_redis_secret}
    volumes:
      - redisdata:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-aeroxe_redis_secret}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aeroxe-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ── Message Bus ───────────────────────────────────────────────────────────
  nats:
    image: nats:2.10-alpine
    command: --jetstream --store_dir /data --http_port 8222
    volumes:
      - natsdata:/data
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - aeroxe-net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ── Object Storage ────────────────────────────────────────────────────────
  # SECURITY: Change MINIO_ACCESS_KEY / MINIO_SECRET_KEY in production!
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - miniodata:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - aeroxe-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  pgdata:
  redisdata:
  natsdata:
  miniodata:

networks:
  aeroxe-net:
    driver: bridge
