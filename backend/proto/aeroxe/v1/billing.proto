syntax = "proto3";

package aeroxe.v1.billing;

import "aeroxe/v1/common.proto";

// ─── Invoice Requests ───

message CreateInvoiceRequest {
  int64 customer_id = 1;
  int64 branch_id = 2;
  int64 subscription_id = 3;
  string billing_period_start = 4;
  string billing_period_end = 5;
  string total_amount = 6;
}

message GetInvoiceRequest {
  int64 invoice_id = 1;
}

message ListInvoicesRequest {
  aeroxe.v1.PaginationRequest pagination = 1;
  optional int64 branch_id = 2;
}

message SendInvoiceRequest {
  int64 invoice_id = 1;
}

message VoidInvoiceRequest {
  int64 invoice_id = 1;
  string reason = 2;
}

message AutoGenerateInvoicesRequest {}

// ─── Payment Requests ───

message RecordPaymentRequest {
  int64 invoice_id = 1;
  int64 customer_id = 2;
  int64 branch_id = 3;
  string amount = 4;
  string payment_method = 5;
}

message ListPaymentsRequest {
  aeroxe.v1.PaginationRequest pagination = 1;
  optional int64 branch_id = 2;
}

// ─── Refund Requests ───

message RequestRefundRequest {
  int64 payment_id = 1;
  int64 invoice_id = 2;
  int64 customer_id = 3;
  string amount = 4;
  string reason = 5;
}

message ApproveRefundRequest {
  int64 refund_id = 1;
}

message RejectRefundRequest {
  int64 refund_id = 1;
  string reason = 2;
}

// ─── Discount Requests ───

message CreateDiscountRequest {
  string name = 1;
  optional string code = 2;
  string discount_type = 3;
  string value = 4;
  string valid_from = 5;
  string valid_until = 6;
}

message ListDiscountsRequest {}

// ─── Line Item Requests ───

message ListInvoiceItemsRequest {
  int64 invoice_id = 1;
}

message AddInvoiceItemRequest {
  int64 invoice_id = 1;
  string description = 2;
  string quantity = 3;
  string unit_price = 4;
  optional string tax_rate = 5;
}

message RemoveInvoiceItemRequest {
  int64 invoice_id = 1;
  int64 item_id = 2;
}

// ─── Config Requests ───

message GetDunningConfigRequest {}

message GetTaxConfigRequest {}

message ListOverdueInvoicesRequest {
  optional int64 branch_id = 1;
}

// ─── Responses ───

message Invoice {
  int64 id = 1;
  string invoice_number = 2;
  int64 customer_id = 3;
  string total_amount = 4;
  string status = 5;
  string due_date = 6;
}

message Payment {
  int64 id = 1;
  string payment_number = 2;
  int64 invoice_id = 3;
  string amount = 4;
  string payment_method = 5;
  string status = 6;
}

message Refund {
  int64 id = 1;
  string refund_number = 2;
  int64 payment_id = 3;
  int64 customer_id = 4;
  string amount = 5;
  string reason = 6;
  string status = 7;
}

message Discount {
  int64 id = 1;
  string name = 2;
  optional string code = 3;
  string discount_type = 4;
  string value = 5;
  string valid_from = 6;
  string valid_until = 7;
  bool is_active = 8;
}

message LineItem {
  int64 id = 1;
  int64 invoice_id = 2;
  string description = 3;
  string quantity = 4;
  string unit_price = 5;
  string amount = 6;
  string tax_rate = 7;
  string tax_amount = 8;
}

message DunningConfig {
  repeated int32 reminder_days = 1;
  int32 suspension_day = 2;
  int32 termination_day = 3;
  string late_fee_percent = 4;
  string late_fee_cap_percent = 5;
  repeated string channels = 6;
}

message TaxConfig {
  string cgst_rate = 1;
  string sgst_rate = 2;
  string igst_rate = 3;
  string applicable_state = 4;
  string hsn_code = 5;
  string sac_code = 6;
  string tax_name = 7;
}

message ListInvoicesResponse {
  repeated Invoice invoices = 1;
  uint64 total = 2;
}

message ListPaymentsResponse {
  repeated Payment payments = 1;
  uint64 total = 2;
}

message ListDiscountsResponse {
  repeated Discount discounts = 1;
}

message ListInvoiceItemsResponse {
  repeated LineItem items = 1;
}

message SendInvoiceResponse {
  int64 invoice_id = 1;
  string status = 2;
  string message = 3;
}

message AutoGenerateResponse {
  int32 generated = 1;
  string message = 2;
}
