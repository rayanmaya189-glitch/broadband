syntax = "proto3";

package aeroxe.v1.payment;

import "aeroxe/v1/common.proto";

// ─── Payment Link Requests ───

message CreatePaymentLinkRequest {
  int64 invoice_id = 1;
  int64 customer_id = 2;
  int64 branch_id = 3;
  string amount = 4;
  optional string currency = 5;
  optional string gateway_id = 6;
  optional string idempotency_key = 7;
  optional string metadata = 8;  // JSON string
  optional int64 expires_in_hours = 9;
}

message ManualPaymentRequest {
  int64 invoice_id = 1;
  int64 customer_id = 2;
  int64 branch_id = 3;
  string amount = 4;
  string payment_method = 5;
  optional string reference_number = 6;
  optional string notes = 7;
}

message RetryPaymentRequest {
  int64 payment_link_id = 1;
  optional string gateway_id = 2;
}

// ─── Gateway Config Requests ───

message ListGatewaysRequest {}

// ─── Responses ───

message PaymentLink {
  int64 id = 1;
  string link_id = 2;
  int64 invoice_id = 3;
  string amount = 4;
  string currency = 5;
  string gateway_id = 6;
  optional string payment_url = 7;
  string status = 8;
  optional string expires_at = 9;
}

message GatewayConfig {
  int64 id = 1;
  string gateway_id = 2;
  string name = 3;
  bool is_primary = 4;
  bool is_active = 5;
  string supported_methods = 6;  // JSON string
  string currency = 7;
}

message WebhookResponse {
  string status = 1;
}

message ListGatewaysResponse {
  repeated GatewayConfig gateways = 1;
}
