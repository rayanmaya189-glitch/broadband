syntax = "proto3";

package aeroxe.v1.ticket;

import "aeroxe/v1/common.proto";

// ─── Requests ───

message CreateTicketRequest {
  string category = 1;
  string priority = 2;
  string subject = 3;
  string description = 4;
  string source = 5;
  optional int64 customer_id = 6;
}

message GetTicketRequest {
  int64 ticket_id = 1;
}

message ListTicketsRequest {
  aeroxe.v1.PaginationRequest pagination = 1;
  optional int64 branch_id = 2;
}

message UpdateTicketRequest {
  int64 ticket_id = 1;
  string subject = 2;
  string priority = 3;
  string category = 4;
}

message AssignTicketRequest {
  int64 ticket_id = 1;
  int64 assigned_to = 2;
}

message ResolveTicketRequest {
  int64 ticket_id = 1;
  optional string resolution_notes = 2;
}

message EscalateTicketRequest {
  int64 ticket_id = 1;
  int64 escalated_to = 2;
  optional string reason = 3;
}

message CloseTicketRequest {
  int64 ticket_id = 1;
  optional string closure_notes = 2;
}

message ReopenTicketRequest {
  int64 ticket_id = 1;
  optional string reopen_reason = 2;
}

message AddCommentRequest {
  int64 ticket_id = 1;
  string comment = 2;
}

message ListTicketCommentsRequest {
  int64 ticket_id = 1;
}

message RateSatisfactionRequest {
  int64 ticket_id = 1;
  int32 rating = 2;
  optional string feedback = 3;
}

message ListMyAssignmentsRequest {
  aeroxe.v1.PaginationRequest pagination = 1;
}

message GetTicketMetricsRequest {}

// ─── Responses ───

message Ticket {
  int64 id = 1;
  string ticket_number = 2;
  string subject = 3;
  string category = 4;
  string priority = 5;
  string status = 6;
  string created_at = 7;
}

message TicketComment {
  int64 id = 1;
  int64 ticket_id = 2;
  int64 user_id = 3;
  string comment = 4;
  string created_at = 5;
}

message ListTicketsResponse {
  repeated Ticket tickets = 1;
  uint64 total = 2;
  uint32 page = 3;
  uint32 limit = 4;
}

message ListTicketCommentsResponse {
  repeated TicketComment items = 1;
}

message TicketMetricsResponse {
  uint64 total_open = 1;
  uint64 total_resolved = 2;
  uint64 total_escalated = 3;
  map<string, uint64> by_priority = 4;
  map<string, uint64> by_status = 5;
}
