syntax = "proto3";

package aeroxe.v1.lead;

import "aeroxe/v1/common.proto";

// ─── Requests ───

message CreateLeadRequest {
  string name = 1;
  string phone = 2;
  optional string email = 3;
  string source = 4;
}

message GetLeadRequest {
  int64 lead_id = 1;
}

message ListLeadsRequest {
  aeroxe.v1.PaginationRequest pagination = 1;
  optional int64 branch_id = 2;
}

message UpdateLeadStatusRequest {
  int64 lead_id = 1;
  string status = 2;
}

message UpdateLeadRequest {
  int64 lead_id = 1;
  optional string name = 2;
  optional string phone = 3;
  optional string email = 4;
  optional string source = 5;
  optional string notes = 6;
}

message AssignLeadRequest {
  int64 lead_id = 1;
  int64 assigned_to = 2;
}

message LogActivityRequest {
  int64 lead_id = 1;
  string activity_type = 2;
  string description = 3;
}

message ListActivitiesRequest {
  int64 lead_id = 1;
}

message ConvertLeadRequest {
  int64 lead_id = 1;
  optional int64 plan_id = 2;
  optional string address = 3;  // JSON string
}

message GetPipelineRequest {}

message GetStatsRequest {}

// ─── Responses ───

message Lead {
  int64 id = 1;
  string name = 2;
  string phone = 3;
  string status = 4;
  string source = 5;
}

message Activity {
  int64 id = 1;
  int64 lead_id = 2;
  string activity_type = 3;
  string description = 4;
  int64 performed_by = 5;
  string created_at = 6;
}

message ConvertLeadResponse {
  int64 lead_id = 1;
  int64 customer_id = 2;
  string customer_code = 3;
  string status = 4;
}

message ListLeadsResponse {
  repeated Lead leads = 1;
  uint64 total = 2;
  uint32 page = 3;
  uint32 limit = 4;
}

message ListActivitiesResponse {
  repeated Activity activities = 1;
}
