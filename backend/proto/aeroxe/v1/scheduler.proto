syntax = "proto3";

package aeroxe.v1.scheduler;

import "aeroxe/v1/common.proto";

// ─── Requests ───

message CreateJobRequest {
  string name = 1;
  optional string description = 2;
  string job_type = 3;
  string schedule = 4;
  string target_module = 5;
  string action = 6;
  optional string payload = 7;  // JSON string
  optional int32 timeout_seconds = 8;
}

message UpdateJobRequest {
  int64 job_id = 1;
  optional string schedule = 2;
  optional string payload = 3;  // JSON string
  optional bool is_active = 4;
  optional int32 timeout_seconds = 5;
}

message DeleteJobRequest {
  int64 job_id = 1;
}

message GetJobRequest {
  int64 job_id = 1;
}

message ListJobsRequest {
  aeroxe.v1.PaginationRequest pagination = 1;
}

message TriggerJobRequest {
  int64 job_id = 1;
}

message ListExecutionsRequest {
  optional int64 job_id = 1;
}

message GetSchedulerStatsRequest {}

// ─── Responses ───

message ScheduledJob {
  int64 id = 1;
  string name = 2;
  optional string description = 3;
  string job_type = 4;
  string schedule = 5;
  string target_module = 6;
  string action = 7;
  optional string payload = 8;  // JSON string
  optional int32 timeout_seconds = 9;
  bool is_active = 10;
  string created_at = 11;
  string updated_at = 12;
}

message JobExecution {
  int64 id = 1;
  int64 job_id = 2;
  string status = 3;
  optional string result = 4;  // JSON string
  optional string error = 5;
  string started_at = 6;
  optional string completed_at = 7;
}

message ListJobsResponse {
  repeated ScheduledJob jobs = 1;
  uint64 total = 2;
}

message ListExecutionsResponse {
  repeated JobExecution executions = 1;
  uint64 total = 2;
}

message TriggerJobResponse {
  int64 id = 1;
  int64 job_id = 2;
  string status = 3;
  string started_at = 4;
}
