syntax = "proto3";

package aeroxe.v1.inventory;

import "aeroxe/v1/common.proto";

// ─── Requests ───

message CreateInventoryItemRequest {
  string item_type = 1;
  optional string serial_number = 2;
  optional string barcode = 3;
}

message ListInventoryRequest {
  aeroxe.v1.PaginationRequest pagination = 1;
  optional int64 branch_id = 2;
}

message AssignInventoryItemRequest {
  int64 item_id = 1;
  int64 assigned_to = 2;
}

// ─── Responses ───

message InventoryItem {
  int64 id = 1;
  string item_type = 2;
  optional string serial_number = 3;
  string status = 4;
}

message ListInventoryResponse {
  repeated InventoryItem items = 1;
  uint64 total = 2;
  uint32 page = 3;
  uint32 limit = 4;
}
