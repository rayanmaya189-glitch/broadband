# =============================================================================
# AeroXe Broadband — Production Docker Compose Overlay
# =============================================================================
# Single canonical production overlay. Extends the base stack in
# backend/docker-compose.yml — there is intentionally no second overlay file.
#
# Usage:
#   cd backend
#   cp .env.example .env          # fill in ALL production secrets
#   cd ..
#   docker compose -f backend/docker-compose.yml -f docker-compose.prod.yml up -d
#
# SECURITY: This file has NO default passwords. Every secret must be provided
# via .env or environment variables. The app will refuse to start in
# production if JWT keys, DB/Redis/MinIO credentials, CORS origins or the
# metrics token are missing.
#
# TLS: certbot obtains and auto-renews Let's Encrypt certificates (every 12h).
# First-time cert issuance requires a manual run:
#   docker compose exec certbot certbot certonly --webroot \
#     -w /var/www/certbot -d ${CERTBOT_DOMAIN} --email ${CERTBOT_EMAIL} --agree-tos
#
# Backups: the backup service runs `pg_dump` at 02:00 daily into the
# `pgbackups` volume (rolling 14-day retention). Restore with:
#   docker compose run --rm backup sh -c \
#     "pg_restore -h postgres -U aeroxe -d aeroxe < /backups/<file>.dump"
# =============================================================================

services:
  # ── Remove dev port bindings ────────────────────────────────────────────────
  # Production traffic flows through nginx → backend on the internal network.
  postgres:
    ports: []          # no host binding — access via app network only
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=3

  redis:
    ports: []          # no host binding
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      - --maxclients
      - "1000"
      - --tcp-backlog
      - "511"
      - --timeout
      - "300"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]

  nats:
    ports: []          # no host binding
    command: --jetstream --store_dir /data --http_port 8222 --max_payload 1048576

  minio:
    ports:
      - "127.0.0.1:9000:9000"   # loopback only — internal access
      - "127.0.0.1:9001:9001"   # loopback only — admin console
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}

  # ── Backend (production overrides) ─────────────────────────────────────────
  backend:
    environment:
      DATABASE_URL: postgresql://aeroxe:${POSTGRES_PASSWORD}@postgres:5432/aeroxe
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      NATS_URL: nats://nats:4222
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_REGION: us-east-1
      TRUST_PROXY: "true"
      MINIO_BUCKET_KYC: aeroxe-kyc
      MINIO_BUCKET_INVOICES: aeroxe-invoices
      MINIO_BUCKET_DOCUMENTS: aeroxe-documents
      SERVER_ADDR: "0.0.0.0:8000"
      APP_ENV: production
      APP_PUBLIC_URL: https://${CERTBOT_DOMAIN:?Set CERTBOT_DOMAIN in .env}
      CORS_ORIGINS: https://${CERTBOT_DOMAIN},https://admin.${CERTBOT_DOMAIN}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?Set JWT_PRIVATE_KEY in .env}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?Set JWT_PUBLIC_KEY in .env}
      METRICS_TOKEN: ${METRICS_TOKEN:?Set METRICS_TOKEN in .env}
      RUST_LOG: aeroxe_backend=info,tower_http=info
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-30}
      DB_MIN_CONNECTIONS: ${DB_MIN_CONNECTIONS:-5}
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2"
        reservations:
          memory: 256M

  # ── Frontend with TLS ──────────────────────────────────────────────────────
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://${CERTBOT_DOMAIN}/api
    ports: []          # nginx serves HTTP/HTTPS directly (no host port needed)
    volumes:
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
      - ./frontend/tls-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - certbot

  # ── Certbot (Let's Encrypt auto-renewal every 12h) ─────────────────────────
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 43200 & wait $${!}; done'"
    networks:
      - aeroxe-net

  # ── Automated PostgreSQL backups (pg_dump) ─────────────────────────────────
  # Dumps the production database to a timestamped file at 02:00 daily,
  # keeping the last 14 dumps. Restore with:
  #   docker compose run --rm backup sh -c \
  #     "pg_restore -h postgres -U aeroxe -d aeroxe < /backups/<file>.dump"
  backup:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGHOST: postgres
      PGUSER: aeroxe
      PGDATABASE: aeroxe
    volumes:
      - pgbackups:/backups
    entrypoint: >
      /bin/sh -c "
      echo '0 2 * * * pg_dump -Fc -f /backups/aeroxe-$$(date +\\%Y\\%m\\%d-\\%H\\%M).dump && ls -1t /backups/aeroxe-*.dump | tail -n +15 | xargs -r rm --' | crontab - &&
      crond -f -l 8
      "
    networks:
      - aeroxe-net
    restart: unless-stopped

volumes:
  certbot-conf:
  certbot-www:
  pgbackups: