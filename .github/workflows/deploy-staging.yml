name: Deploy to Staging

on:
  push:
    branches: [develop, dev-v4]
  workflow_run:
    workflows: ["AeroXe CI"]
    types: [completed]
    branches: [develop, dev-v4]

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    # Only run if CI passed
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    environment:
      name: staging
      url: https://staging.aeroxebroadband.com
    concurrency:
      group: staging-deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Add host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy backend containers
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER || 'deploy' }}
          STAGING_DIR: ${{ secrets.STAGING_DIR || '/opt/aeroxe' }}
        run: |
          # Pull latest images and restart services
          ssh ${STAGING_USER}@${STAGING_HOST} << 'DEPLOY_SCRIPT'
            set -euo pipefail
            cd $STAGING_DIR

            echo "📥 Pulling latest images..."
            docker compose pull

            echo "🔄 Running database migrations..."
            docker compose run --rm migrate

            echo "🚀 Restarting services with zero-downtime..."
            docker compose up -d --remove-orphans

            echo "🧹 Cleaning up old images..."
            docker image prune -f --filter "until=72h"

            echo "✅ Verifying health..."
            for i in {1..30}; do
              if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
                echo "✅ Backend is healthy!"
                exit 0
              fi
              sleep 2
            done
            echo "❌ Backend health check failed after 60s"
            exit 1
          DEPLOY_SCRIPT

      - name: Notify deployment status
        if: always()
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            echo "✅ Staging deployment succeeded"
          else
            echo "❌ Staging deployment failed"
          fi

  smoke-test:
    name: Staging Smoke Test
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    steps:
      - name: Wait for services
        run: sleep 10

      - name: Health check
        run: |
          for endpoint in /health /ready; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://staging.aeroxebroadband.com/api${endpoint}" || echo "000")
            if [ "$STATUS" != "200" ]; then
              echo "❌ ${endpoint} returned ${STATUS}"
              exit 1
            fi
            echo "✅ ${endpoint} → ${STATUS}"
          done

      - name: Frontend check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://staging.aeroxebroadband.com" || echo "000")
          if [ "$STATUS" != "200" ]; then
            echo "❌ Frontend returned ${STATUS}"
            exit 1
          fi
          echo "✅ Frontend → ${STATUS}"
