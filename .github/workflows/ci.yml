name: AeroXe CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Code Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy lints
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Run unit tests
        run: cargo test --lib -- --test-threads=4

  integration-test:
    name: Integration + E2E Tests
    runs-on: ubuntu-latest
    needs: [check, test]
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: aeroxe_test
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d aeroxe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Run integration tests
        env:
          TEST_DATABASE_URL: postgres://test_user:test_password@localhost:15432/aeroxe_test
        run: cargo test --test integration -- --ignored --test-threads=4
      - name: Run e2e tests
        env:
          TEST_DATABASE_URL: postgres://test_user:test_password@localhost:15432/aeroxe_test
        run: cargo test --test e2e -- --ignored --test-threads=4

  migration-check:
    name: Migration Validation
    runs-on: ubuntu-latest
    needs: [check]
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: aeroxe_test
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d aeroxe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Build migrate binary
        run: cargo build --release --bin migrate
      - name: Run migrations (up)
        env:
          DATABASE_URL: postgres://test_user:test_password@localhost:15432/aeroxe_test
        run: ./target/release/migrate up
      - name: Run migrations (status)
        env:
          DATABASE_URL: postgres://test_user:test_password@localhost:15432/aeroxe_test
        run: ./target/release/migrate status
      - name: Run migrations (fresh + up — idempotency check)
        env:
          DATABASE_URL: postgres://test_user:test_password@localhost:15432/aeroxe_test
        run: |
          ./target/release/migrate fresh
          ./target/release/migrate up

  frontend:
    name: Frontend Build + Typecheck + Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npx playwright test --reporter=list

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run cargo audit
        run: cargo audit
      - name: Install cargo-deny
        run: cargo install cargo-deny
      - name: Run cargo deny
        run: cargo deny check

  build:
    name: Build Release
    runs-on: ubuntu-latest
    needs: [check, test, security-audit, frontend]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Build release binary
        run: cargo build --release
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: aeroxe-backend
          path: backend/target/release/aeroxe-backend

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [check, test, frontend, migration-check]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: frontend
          push: true
          tags: ghcr.io/${{ github.repository }}/frontend:${{ github.ref_name }}
          build-args: |
            VITE_API_URL=${{ github.ref_name == 'main' && 'https://api.aeroxebroadband.com/api' || 'http://localhost:8000/api' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
